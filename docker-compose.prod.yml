services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      S3_ENDPOINT:
      S3_PUBLIC_BASE_URL:
      S3_BUCKET:
      S3_ACCESS_KEY:
      S3_SECRET_KEY:
      COOKIE_DOMAIN:
      COOKIE_SECURE:
      CORS_ORIGIN:
      OAUTH_REDIRECT_BASE:
      FRONTEND_URL:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      FACEBOOK_APP_ID:
      FACEBOOK_APP_SECRET:
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 384m
    networks:
      - internal

  web:
    image: ghcr.io/${WEB_IMAGE}:${WEB_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    expose:
      - "3000"
    mem_limit: 384m
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bound to droplet's loopback only — not public. Reach from your laptop via SSH tunnel.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks:
      - internal

  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
    volumes:
      - miniodata:/bitnami/minio/data
    # Bitnami minideb-based image ships bash; use the /dev/tcp pseudo-device
    # to confirm port 9000 is accepting connections. Independent of curl/wget
    # availability, which can change across image updates.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      ACME_EMAIL: ${ACME_EMAIL}
      ACME_CA: ${ACME_CA}
      CADDY_INGRESS_API: ${APP_SERVICE_HOST:-app}:${APP_PORT_INTERNAL:-8080}
      CADDY_INGRESS_WEB: ${WEB_SERVICE_HOST:-web}:${WEB_PORT_INTERNAL:-3000}
      CADDY_INGRESS_MEDIA: ${MINIO_SERVICE_HOST:-minio}:${MINIO_PORT_INTERNAL:-9000}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  miniodata:

networks:
  internal:
