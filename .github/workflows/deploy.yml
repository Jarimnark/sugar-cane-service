name: Deploy

on:
  push:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: sugarcane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://app:app@localhost:5432/sugarcane_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    if: github.ref_name != 'main' || vars.PROD_READY == 'true'

    env:
      PROJECT_NAME: ${{ github.ref_name == 'main' && 'sugarcane-prod' || 'sugarcane-staging' }}
      PROJECT_SUBDIR: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      ENV_FILE: .env
      APP_TAG: ${{ github.ref_name == 'main' && 'latest' || 'develop' }}
      PROFILE_FLAG: ''

    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy host
        id: host
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "deploy_host=${{ secrets.PROD_DROPLET_HOST }}" >> "$GITHUB_OUTPUT"
            echo "env_b64=${{ secrets.PROD_ENV_B64 }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_host=${{ secrets.DROPLET_HOST }}" >> "$GITHUB_OUTPUT"
            echo "env_b64=${{ secrets.STAGING_ENV_B64 }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Render env file from GitHub Secrets
        env:
          ENV_B64: ${{ steps.host.outputs.env_b64 }}
        run: |
          set -e
          echo "$ENV_B64" | base64 -d > "$ENV_FILE"
          chmod 644 "$ENV_FILE"

      - name: Upload env file to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.host.outputs.deploy_host }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: ${{ env.ENV_FILE }}
          target: /opt/sugarcane/${{ env.PROJECT_SUBDIR }}/

      - name: Upload compose + Caddyfile to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.host.outputs.deploy_host }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "docker-compose.prod.yml,caddy/Caddyfile"
          target: /opt/sugarcane/${{ env.PROJECT_SUBDIR }}/

      - name: Clean local env tmpfile
        if: always()
        run: rm -f "$ENV_FILE"

      - name: Migrate & Restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.host.outputs.deploy_host }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: PROJECT_NAME,PROJECT_SUBDIR,ENV_FILE,APP_TAG,PROFILE_FLAG
          script: |
            set -e
            cd /opt/sugarcane/$PROJECT_SUBDIR

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            COMPOSE="docker compose -f docker-compose.prod.yml $PROFILE_FLAG --env-file $ENV_FILE -p $PROJECT_NAME"

            $COMPOSE pull app

            DB_URL="$(grep ^DATABASE_URL $ENV_FILE | cut -d= -f2-)"
            $COMPOSE run --rm \
              -e DATABASE_URL="$DB_URL" \
              -e APP_TAG=$APP_TAG \
              app \
              sh -c 'goose -dir db/migrations postgres "$DATABASE_URL" up'

            $COMPOSE up -d

            docker image prune -f

  prod-skipped:
    name: Prod deploy skipped (not provisioned)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && vars.PROD_READY != 'true'
    steps:
      - name: Explain skip
        run: |
          echo "prod droplet not provisioned; see iac/handoffs/a1-pulumi.md for how to flip createDroplet=true on the prod stack"
          echo "set the repo variable PROD_READY=true once the droplet exists and PROD_DROPLET_HOST + PROD_ENV_B64 secrets are populated"
